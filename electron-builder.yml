appId: com.termdeck.app
productName: TermDeck
npmRebuild: false
directories:
  output: dist
  buildResources: build

files:
  - "out/**/*"
  - "!out/**/*.map"
  - "package.json"
  - "!**/deps/**"
  - "!**/build/**/obj/**"
  - "!**/*.{tlog,pdb,cc,cpp,c,h,hpp,vcxproj,vcxproj.filters,sln,ninja,ninja_deps,ninja_log,recipe,ipch,iobj,ipdb,exp,lib}"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/*.d.ts"
  - "!**/*.map"
  - "!**/*.md"

asarUnpack:
  - "**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**/*"
  - "**/node_modules/cpu-features/**/*"
  - "!**/deps/**"
  - "!**/build/**/obj/**"
  - "!**/*.{tlog,pdb,cc,cpp,c,h,hpp,vcxproj,vcxproj.filters,sln,ninja,ninja_deps,ninja_log,recipe,ipch,iobj,ipdb,exp,lib}"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/*.d.ts"
  - "!**/*.map"
  - "!**/*.md"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TermDeck

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Development

publish:
  provider: github
  owner: termdeck
  repo: termdeck
