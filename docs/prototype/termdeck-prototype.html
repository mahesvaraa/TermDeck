<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TermDeck — прототип</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141a;--panel:#191c24;--panel2:#1f232d;--line:#2a2f3b;--tx:#d6dae4;--mut:#818899;--acc:#7aa2f7;--ok:#8bd49c;--warn:#e5b567;--err:#f07178;--term:#0d0f14;--termtx:#c9d1e0;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eceef3;--panel:#f6f7fa;--panel2:#e4e7ee;--line:#d2d6e0;--tx:#242833;--mut:#6b7285;--acc:#3b5bdb}}
:root[data-theme="dark"]{--bg:#12141a;--panel:#191c24;--panel2:#1f232d;--line:#2a2f3b;--tx:#d6dae4;--mut:#818899;--acc:#7aa2f7}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:13px/1.4 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{flex:1;display:flex;min-height:0}
.side{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.side h3{margin:0;padding:10px 12px 6px;font-size:12px;font-weight:600;color:var(--mut)}
.search{margin:4px 10px 6px;padding:6px 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--mut)}
.tree{flex:1;overflow:auto;padding:0 6px}
.row{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
.row:hover{background:var(--panel2)}
.row.sub{padding-left:26px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok)}
.side .btns{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.btn{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#10131a;font-weight:600}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--bg);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:7px 7px 0 0;color:var(--mut);white-space:nowrap}
.tab.act{background:var(--panel);color:var(--tx);box-shadow:inset 0 2px 0 var(--acc)}
.tab .x{opacity:.5}.tab .x:hover{opacity:1;color:var(--err)}
.plus{padding:7px 10px;color:var(--mut)}
.bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.bar .sp{flex:1}
.work{flex:1;display:flex;min-height:0;background:var(--panel)}
.sftp{width:310px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.path{display:flex;gap:2px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.path button{padding:2px 5px;border-radius:4px}.path button:hover{background:var(--panel2);color:var(--acc)}
.path i{color:var(--mut);font-style:normal}
.files{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:500;color:var(--mut);padding:5px 8px;border-bottom:1px solid var(--line)}
td{padding:4px 8px;white-space:nowrap}
tr.f{cursor:pointer}tr.f:hover td{background:var(--panel2)}tr.sel td{background:color-mix(in srgb,var(--acc) 22%,transparent)}
td.n{max-width:130px;overflow:hidden;text-overflow:ellipsis}
td.m{color:var(--mut);font-family:var(--mono);font-size:11px}
.xf{border-top:1px solid var(--line);padding:8px 10px;flex:none}
.xf b{font-weight:600}
.pg{height:5px;background:var(--bg);border-radius:3px;margin:4px 0 6px;overflow:hidden}
.pg span{display:block;height:100%;background:var(--acc);border-radius:3px}
.mut{color:var(--mut)}
.termwrap{flex:1;display:flex;flex-direction:column;min-width:0}
.term{flex:1;background:var(--term);color:var(--termtx);font:13px/1.5 var(--mono);padding:10px 14px;overflow:auto;white-space:pre-wrap}
.term .g{color:var(--ok)}.term .b{color:var(--acc)}.term .y{color:var(--warn)}.term .r{color:var(--err)}.term .d{color:#6b7385}
.cur{display:inline-block;width:8px;height:15px;background:var(--termtx);vertical-align:-3px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.status{display:flex;gap:16px;padding:4px 12px;background:var(--panel2);border-top:1px solid var(--line);color:var(--mut);font-size:12px;flex:none;overflow-x:auto;white-space:nowrap}
.status .ok{color:var(--ok)}
.pill{padding:1px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:11px}
button:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (max-width:820px){.side{display:none}.work{flex-direction:column}.sftp{width:100%;height:42%;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h3>Сессии</h3>
    <div class="search">Поиск сессии…</div>
    <div class="tree" id="tree"></div>
    <div class="btns"><button class="btn pri">Новая сессия</button><button class="btn">Ключи</button></div>
  </aside>
  <section class="main">
    <div class="tabs" id="tabs"></div>
    <div class="bar">
      <button class="btn">Разделить →</button><button class="btn">Разделить ↓</button>
      <button class="btn">Туннели (2)</button><button class="btn">Сниппеты</button><button class="btn">Multi-exec</button>
      <span class="sp"></span><span class="pill" id="pill"></span>
    </div>
    <div class="work">
      <div class="sftp" id="sftp">
        <div class="path" id="path"></div>
        <div class="files"><table><thead><tr><th>Имя</th><th>Размер</th><th>Права</th></tr></thead><tbody id="files"></tbody></table></div>
        <div class="xf" id="xf"></div>
      </div>
      <div class="termwrap"><div class="term" id="term"></div></div>
    </div>
  </section>
</div>
<div class="status" id="status"></div>

<script>
const S=[
 {id:'web',t:'prod-web-01',host:'deploy@10.0.4.21',type:'ssh',path:'/var/www',up:'3д 4ч',
  term:`<span class="d">Connected to 10.0.4.21 · Ubuntu 22.04 · host key SHA256:k3Nq…xP0 доверенный</span>
<span class="g">deploy@prod-web-01</span>:<span class="b">/var/www</span>$ ls -la
total 24
drwxr-xr-x  5 www-data www-data 4096 Sep 30 18:02 <span class="b">.</span>
drwxr-xr-x 14 root     root     4096 Aug 11 09:40 <span class="b">..</span>
drwxr-xr-x  7 deploy   deploy   4096 Sep 30 18:02 <span class="b">app</span>
-rw-r--r--  1 deploy   deploy    612 Sep 28 12:15 deploy.sh
drwxr-xr-x  2 www-data www-data 4096 Sep 12 07:31 <span class="b">static</span>
<span class="g">deploy@prod-web-01</span>:<span class="b">/var/www</span>$ tail -n 3 /var/log/nginx/error.log
<span class="y">2026/10/01 08:41:12 [warn] upstream response is buffered to a temporary file</span>
<span class="r">2026/10/01 09:03:55 [error] connect() failed (111) while connecting to upstream</span>
<span class="d">2026/10/01 09:04:02 [info] upstream recovered</span>
<span class="g">deploy@prod-web-01</span>:<span class="b">/var/www</span>$ <span class="cur"></span>`},
 {id:'db',t:'db-staging',host:'postgres@10.0.7.5',type:'ssh',path:'/var/lib/postgresql',up:'12д 1ч',
  term:`<span class="d">Connected via jump host bastion.corp → 10.0.7.5</span>
<span class="g">postgres@db-staging</span>:<span class="b">~</span>$ psql -c "select count(*) from orders;"
 count
--------
 184203
(1 row)

<span class="g">postgres@db-staging</span>:<span class="b">~</span>$ <span class="cur"></span>`},
 {id:'loc',t:'zsh (local)',host:'anna@laptop',type:'local',path:'/home/anna',up:'—',
  term:`<span class="g">anna@laptop</span> <span class="b">~/projects/termdeck</span> % git status -sb
## main...origin/main
 <span class="y">M</span> src/main/services/ssh/SshConnectionManager.ts
<span class="r">??</span> src/renderer/features/sftp/
<span class="g">anna@laptop</span> <span class="b">~/projects/termdeck</span> % <span class="cur"></span>`}
];
const D='drwxr-xr-x',F='-rw-r--r--';
const FS={
 '/var/www':[['app','d','—',D],['static','d','—',D],['deploy.sh','f','612 B','-rwxr-xr-x'],['index.html','f','4.1 KB',F],['.env','f','231 B','-rw-------']],
 '/var/www/app':[['src','d','—',D],['dist','d','—',D],['package.json','f','1.8 KB',F],['server.js','f','12 KB',F]],
 '/var':[['www','d','—',D],['log','d','—',D],['lib','d','—',D],['tmp','d','—','drwxrwxrwt']],
 '/var/log':[['nginx','d','—',D],['syslog','f','48 MB','-rw-r-----'],['auth.log','f','2.2 MB','-rw-r-----'],['dpkg.log','f','310 KB',F]],
 '/var/log/nginx':[['access.log','f','128 MB',F],['error.log','f','94 KB',F]],
 '/':[['etc','d','—',D],['home','d','—',D],['var','d','—',D],['opt','d','—',D]],
 '/var/lib':[['postgresql','d','—',D]],
 '/var/lib/postgresql':[['15','d','—','drwx------'],['backup.sql.gz','f','1.2 GB',F],['.psql_history','f','4 KB','-rw-------']],
 '/var/lib/postgresql/15':[['main','d','—','drwx------']],
 '/home':[['anna','d','—',D]],
 '/home/anna':[['projects','d','—',D],['Downloads','d','—',D],['notes.md','f','3 KB',F]]
};
let cur=0,sel=null;const paths=S.map(s=>s.path);
const $=id=>document.getElementById(id);
function render(){
 $('tabs').innerHTML=S.map((s,i)=>`<button class="tab ${i==cur?'act':''}" onclick="go(${i})"><span class="dot ${s.type=='ssh'?'on':''}"></span>${s.t}<span class="x" role="button" aria-label="Закрыть">×</span></button>`).join('')+'<button class="plus">+</button>';
 const s=S[cur];$('term').innerHTML=s.term;
 $('pill').textContent=s.type=='ssh'?'SFTP следует за терминалом (OSC 7)':'Локальный терминал';
 $('sftp').style.display='';
 files();status();
}
function files(){
 const p=paths[cur];sel=null;
 const parts=p.split('/').filter(Boolean);let acc='';
 $('path').innerHTML='<button onclick="nav(\'/\')">/</button>'+parts.map(x=>{acc+='/'+x;const a=acc;return `<button onclick="nav('${a}')">${x}</button><i>/</i>`}).join('');
 const rows=FS[p]||[];
 $('files').innerHTML=(p!='/'?`<tr class="f" ondblclick="nav('${p.split('/').slice(0,-1).join('/')||'/'}')"><td class="n">📁 ..</td><td class="m"></td><td class="m"></td></tr>`:'')+
  rows.map((r,i)=>`<tr class="f" onclick="pick(this)" ${r[1]=='d'?`ondblclick="nav('${(p=='/'?'':p)+'/'+r[0]}')"`:''}><td class="n">${r[1]=='d'?'📁':'📄'} ${r[0]}</td><td class="m">${r[2]}</td><td class="m">${r[3]}</td></tr>`).join('')||'<tr><td class="mut" colspan="3">Папка пуста</td></tr>';
 $('xf').innerHTML=`<b>Передачи</b><div style="margin-top:6px">⬆ backup-2026-10-01.tar.gz <span class="mut">· 64%</span></div><div class="pg"><span style="width:64%"></span></div><div>⬇ error.log <span class="ok" style="color:var(--ok)">· готово</span></div><div class="mut" style="margin-top:6px">Двойной клик — открыть папку · перетащите файл сюда, чтобы загрузить</div>`;
}
function pick(el){document.querySelectorAll('tr.sel').forEach(e=>e.classList.remove('sel'));el.classList.add('sel')}
function nav(p){paths[cur]=p;files();status()}
function go(i){cur=i;render()}
function status(){const s=S[cur];
 $('status').innerHTML=`<span class="${s.type=='ssh'?'ok':''}">● ${s.type=='ssh'?'Подключено':'Локально'}</span><span>${s.host}</span><span>Путь: ${paths[cur]}</span><span>Аптайм: ${s.up}</span><span style="margin-left:auto">UTF-8 · 120×32</span>`}
const tree=[['★ Избранное',[['prod-web-01',1],['db-staging',1]]],['Production',[['prod-web-01',1],['prod-web-02',0],['bastion.corp',0]]],['Staging',[['db-staging',1],['cache-01',0]]],['Домашний сервер',[['nas.lan',0],['pi-zero',0]]]];
$('tree').innerHTML=tree.map(([f,c])=>`<div class="row" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">▾ ${f}</div><div>${c.map(([n,on])=>`<div class="row sub"><span class="dot ${on?'on':''}"></span>${n}</div>`).join('')}</div>`).join('');
render();
</script>
</body>
</html>
